<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大五人格测试</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f7fa; color: #1a2332; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .container { max-width: 720px; width: 100%; background: #ffffff; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,20,40,0.08); padding: 28px 24px 32px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #0b1a2e; }
        .header .sub { font-size: 14px; color: #6b7a8d; margin-top: 4px; }
        .badge-progress { display: inline-block; background: #eef2f7; padding: 4px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; color: #2c3e50; margin-top: 12px; }
        .instruction { background: #f0f4fe; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; font-size: 14px; line-height: 1.6; color: #1e3a5f; border-left: 4px solid #3b7cff; }
        .instruction strong { color: #0b2b5c; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; color: #1e2a3a; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #dce2ec; border-radius: 12px; font-size: 16px; background: #fafcff; outline: none; transition: 0.15s; }
        .form-group input:focus { border-color: #3b7cff; box-shadow: 0 0 0 3px rgba(59,124,255,0.12); }
        .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 14px 0; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.15s; background: #eef2f7; color: #1a2a3a; }
        .btn-primary { background: #1a2a3a; color: #fff; }
        .btn-primary:hover { background: #0f1e2e; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(26,42,58,0.18); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
        .btn-secondary { background: #e8edf5; color: #1a2a3a; }
        .btn-secondary:hover { background: #dce3ee; }
        .question-card { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .q-number { font-size:13px; font-weight:600; color:#3b7cff; background:#eef4fe; display:inline-block; padding:2px 14px; border-radius:20px; margin-bottom:12px; }
        .q-text { font-size:18px; font-weight:500; line-height:1.5; margin-bottom:20px; color:#0b1a2e; }
        .options { display:flex; flex-direction:column; gap:10px; }
        .option-item { display:flex; align-items:center; padding:14px 18px; border:2px solid #e8edf5; border-radius:14px; cursor:pointer; transition:0.12s; background:#fafcff; user-select:none; }
        .option-item:hover { border-color:#b8c9e0; background:#f5f8fe; }
        .option-item.selected { border-color:#1a2a3a; background:#f0f4fe; }
        .option-item input[type="radio"] { display:none; }
        .option-label { font-size:15px; font-weight:500; margin-left:12px; flex:1; }
        .option-score { font-size:13px; font-weight:600; color:#6b7a8d; background:#eef2f7; padding:2px 12px; border-radius:20px; }
        .option-item.selected .option-score { background:#1a2a3a; color:#fff; }
        .option-item .radio-circle { width:22px; height:22px; border-radius:50%; border:2px solid #ccd7e6; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:0.12s; }
        .option-item.selected .radio-circle { border-color:#1a2a3a; background:#1a2a3a; }
        .option-item.selected .radio-circle::after { content:"✓"; color:#fff; font-size:13px; font-weight:700; }
        .progress-wrap { margin-top:20px; margin-bottom:8px; }
        .progress-bar-bg { width:100%; height:6px; background:#e8edf5; border-radius:10px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:#1a2a3a; border-radius:10px; transition:width 0.3s ease; width:0%; }
        .progress-text { display:flex; justify-content:space-between; font-size:13px; color:#6b7a8d; margin-top:6px; }
        .success-icon { font-size:64px; text-align:center; margin:24px 0 12px; }
        .success-title { font-size:24px; font-weight:700; text-align:center; color:#0b1a2e; }
        .success-desc { text-align:center; color:#6b7a8d; margin:8px 0 24px; font-size:16px; }
        .admin-table-wrap { overflow-x:auto; margin-top:16px; }
        .admin-table { width:100%; border-collapse:collapse; font-size:14px; min-width:800px; }
        .admin-table th { background:#f0f4fa; padding:10px 12px; text-align:left; font-weight:600; color:#1a2a3a; border-bottom:2px solid #dce2ec; white-space:nowrap; }
        .admin-table td { padding:10px 12px; border-bottom:1px solid #e8edf5; vertical-align:middle; }
        .admin-table tr:hover td { background:#f8fafd; }
        .admin-stat { display:flex; gap:20px; flex-wrap:wrap; margin:12px 0 16px; }
        .admin-stat span { background:#f0f4fa; padding:6px 16px; border-radius:20px; font-size:14px; }
        .hidden { display:none !important; }
        .footer-note { text-align:center; margin-top:20px; font-size:12px; color:#a0b0c0; }
        .back-link { display:inline-block; margin-bottom:16px; color:#3b7cff; font-weight:500; cursor:pointer; }
        .back-link:hover { text-decoration:underline; }
        @media (max-width:480px) { .container { padding:20px 16px; border-radius:20px; } .q-text { font-size:16px; } .option-item { padding:12px 14px; } .header h1 { font-size:20px; } .admin-table { font-size:12px; min-width:600px; } }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-thumb { background:#ccd7e6; border-radius:10px; }
        ::-webkit-scrollbar-track { background:#f0f4fa; }
        .consistency-warn { background:#fef6f0; border-left:4px solid #e67e22; padding:14px 18px; border-radius:12px; margin:16px 0; font-size:14px; color:#7a4a1a; }
        .consistency-ok { background:#edf7f0; border-left:4px solid #27ae60; padding:14px 18px; border-radius:12px; margin:16px 0; font-size:14px; color:#1a6a3a; }
        .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
        .result-item { background:#f5f8fe; border-radius:16px; padding:16px 14px; text-align:center; }
        .result-item .dim { font-size:13px; font-weight:600; color:#6b7a8d; letter-spacing:0.5px; text-transform:uppercase; }
        .result-item .score { font-size:28px; font-weight:700; color:#0b1a2e; margin:4px 0; }
        .result-item .level { font-size:13px; font-weight:500; padding:2px 12px; border-radius:20px; display:inline-block; }
        .level-high { background:#e1f7e8; color:#0d6e3a; }
        .level-mid { background:#fff4e0; color:#a5650a; }
        .level-low { background:#fde8e8; color:#b13a3a; }
        .type-badge { display:inline-block; background:#0b1a2e; color:#fff; padding:8px 24px; border-radius:30px; font-size:18px; font-weight:700; margin:12px 0 6px; }
        .type-desc { font-size:15px; color:#2c3e50; margin-top:4px; text-align:center; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div id="page-test"></div>
        <div id="page-success" class="hidden"></div>
        <div id="page-admin" class="hidden"></div>
        <div id="page-admin-detail" class="hidden"></div>
    </div>

    <script>
        // ===================== 问卷数据 =====================
        const QUESTIONS = [
            { id: 1, text: "我是聚会中的焦点。", dim: "E", dir: "+" },
            { id: 2, text: "我对他人很少关心。", dim: "A", dir: "-" },
            { id: 3, text: "我总是提前做好准备。", dim: "C", dir: "+" },
            { id: 4, text: "我容易感到压力。", dim: "N", dir: "-" },
            { id: 5, text: "我的词汇量丰富。", dim: "O", dir: "+" },
            { id: 6, text: "我话不多。", dim: "E", dir: "-" },
            { id: 7, text: "我对人充满兴趣。", dim: "A", dir: "+" },
            { id: 8, text: "我经常把物品乱放。", dim: "C", dir: "-" },
            { id: 9, text: "大多数时候我很放松。", dim: "N", dir: "+" },
            { id: 10, text: "我理解抽象概念有困难。", dim: "O", dir: "-" },
            { id: 11, text: "与人相处让我感到自在。", dim: "E", dir: "+" },
            { id: 12, text: "我会出口伤人。", dim: "A", dir: "-" },
            { id: 13, text: "我关注细节。", dim: "C", dir: "+" },
            { id: 14, text: "我经常担忧。", dim: "N", dir: "-" },
            { id: 15, text: "我的想象力生动。", dim: "O", dir: "+" },
            { id: 16, text: "我习惯保持低调。", dim: "E", dir: "-" },
            { id: 17, text: "我善于体会他人情绪。", dim: "A", dir: "+" },
            { id: 18, text: "我常把事情弄乱。", dim: "C", dir: "-" },
            { id: 19, text: "我很少情绪低落。", dim: "N", dir: "+" },
            { id: 20, text: "我对抽象思想不感兴趣。", dim: "O", dir: "-" },
            { id: 21, text: "我会主动开启对话。", dim: "E", dir: "+" },
            { id: 22, text: "我对别人的问题漠不关心。", dim: "A", dir: "-" },
            { id: 23, text: "我立即完成待办事项。", dim: "C", dir: "+" },
            { id: 24, text: "我容易被干扰。", dim: "N", dir: "-" },
            { id: 25, text: "我常有好点子。", dim: "O", dir: "+" },
            { id: 26, text: "我很少发言。", dim: "E", dir: "-" },
            { id: 27, text: "我心肠软。", dim: "A", dir: "+" },
            { id: 28, text: "我常忘记把东西归位。", dim: "C", dir: "-" },
            { id: 29, text: "我容易沮丧。", dim: "N", dir: "-" },
            { id: 30, text: "我缺乏想象力。", dim: "O", dir: "-" },
            { id: 31, text: "在聚会上我能与多人交谈。", dim: "E", dir: "+" },
            { id: 32, text: "我对他人兴趣不大。", dim: "A", dir: "-" },
            { id: 33, text: "我喜欢井然有序。", dim: "C", dir: "+" },
            { id: 34, text: "我情绪波动大。", dim: "N", dir: "-" },
            { id: 35, text: "我领悟新事物很快。", dim: "O", dir: "+" },
            { id: 36, text: "我不喜欢成为注意中心。", dim: "E", dir: "-" },
            { id: 37, text: "我愿意为他人腾出时间。", dim: "A", dir: "+" },
            { id: 38, text: "我会逃避职责。", dim: "C", dir: "-" },
            { id: 39, text: "我情绪起伏频繁。", dim: "N", dir: "+" },
            { id: 40, text: "我常用高难度词汇。", dim: "O", dir: "+" },
            { id: 41, text: "我不介意成为焦点。", dim: "E", dir: "+" },
            { id: 42, text: "我能感受他人情绪。", dim: "A", dir: "+" },
            { id: 43, text: "我按计划行事。", dim: "C", dir: "+" },
            { id: 44, text: "我容易烦躁。", dim: "N", dir: "-" },
            { id: 45, text: "我常花时间反思。", dim: "O", dir: "+" },
            { id: 46, text: "我在陌生人面前很安静。", dim: "E", dir: "-" },
            { id: 47, text: "我能让别人放松。", dim: "A", dir: "+" },
            { id: 48, text: "我对工作要求严格。", dim: "C", dir: "+" },
            { id: 49, text: "我经常感到忧郁。", dim: "N", dir: "+" },
            { id: 50, text: "我充满创意。", dim: "O", dir: "+" }
        ];

        const DIM_KEYS = ['E', 'A', 'C', 'N', 'O'];
        const DIM_NAMES = { E: "外向性", A: "宜人性", C: "尽责性", N: "情绪稳定性", O: "开放性" };
        const TYPE_MAP = {
            "HHHHL": "全能领袖型 (魅力＋合作＋自律＋情绪稳＋创新)",
            "HHHLL": "传统队长型 (外向、可靠、亲和、保守)",
            "HHHHH": "高压创意总监 (高能量＋完美主义＋易焦虑)",
            "HHHHL": "操心组织者 (热心、规矩、神经紧绷)",
            "HHLHH": "社交梦想家 (点子多、执行力弱、好相处)",
            "HHLHL": "随和玩家 (爱热闹、不较真、随性)",
            "HHLHH": "情绪波动艺术家 (外向、敏感、创意、散漫)",
            "HHLHL": "焦虑话痨好人 (热心、担忧、拖延)",
            "HLHLH": "进取开拓者 (果断、自律、求新、不迁就)",
            "HLHLL": "传统硬汉经理 (外向、守纪、强硬、务实)",
            "HLHHH": "高压创新领袖 (雄心、焦虑、掌控、开放)",
            "HLHHL": "紧张控制者 (强势、细节控、神经质)",
            "HLLHH": "冒险创业家 (冲劲、点子多、无条理、冷漠)",
            "HLLHL": "魅力销售王 (能说会道、粗放、自我中心)",
            "HLLHH": "波动叛逆者 (外向、不安、冲动、前卫)",
            "HLLHL": "冲动支配者 (暴躁、随性、自我)",
            "LHH LH": "安静策划者 (内向、可靠、温和、创新)",
            "LHHLL": "幕后守护者 (低调、守规矩、亲切、保守)",
            "LHHHH": "谨慎完美主义者 (内向、焦虑、负责、创意)",
            "LHHHL": "担忧支援者 (内向、规矩、体贴、易紧张)",
            "LHLHH": "佛系梦想家 (内向、随性、友善、好奇)",
            "LHLHL": "温和懒人 (好相处、不主动、无计划)",
            "LHLHH": "敏感诗人 (内向、焦虑、亲和、创意)",
            "LHLHL": "社恐老好人 (害羞、担忧、体贴)",
            "LLHLH": "冷面专家 (内向、自律、理性、求新)",
            "LLHLL": "技术工匠 (内向、严谨、务实、不社交)",
            "LLHHH": "焦虑天才 (内向、完美、神经质、创意)",
            "LLHHL": "紧张技术控 (内向、细节控、忧虑、保守)",
            "LL LHH": "孤僻思想家 (内向、随性、冷漠、好奇)",
            "LLLLL": "隐士懒人 (低能量、低合作、低规划、低兴趣)",
            "LLLHH": "边缘艺术家 (内向、冲动、焦虑、前卫)",
            "LLLHL": "退缩暴躁者 (孤僻、懒散、易怒)"
        };
        const CONSISTENCY_PAIRS = [
            [1,6],[11,16],[21,26],[31,36],[41,46],
            [2,7],[12,17],[22,27],[32,37],
            [3,8],[13,18],[23,28],[33,38],[43,48],
            [4,9],[14,19],[24,29],[34,39],[44,49],
            [5,10],[15,20],[25,30],[35,40],[45,50]
        ];

        // ===================== 工具函数 =====================
        function getDimItems(dim) { return QUESTIONS.filter(q=>q.dim===dim); }
        function calcScores(answers) {
            let scores={}, levels={}, raw={};
            for (let d of DIM_KEYS) {
                let items=getDimItems(d), sum=0;
                for (let q of items) {
                    let idx=q.id-1, val=answers[idx]||3;
                    if(q.dir==='-') val=6-val;
                    sum+=val;
                }
                raw[d]=sum; scores[d]=Math.round(sum);
                if(sum<=29) levels[d]='低'; else if(sum<=40) levels[d]='中'; else levels[d]='高';
            }
            return {scores, levels, raw};
        }
        function getTypeKey(levels) { let key=''; for(let d of DIM_KEYS) key+=(levels[d]==='高'?'H':'L'); return key; }
        function getTypeName(key) {
            for(let [k,v] of Object.entries(TYPE_MAP)) if(k.replace(/\s/g,'')===key) return v;
            for(let [k,v] of Object.entries(TYPE_MAP)) {
                let cleanK=k.replace(/\s/g,'');
                if(cleanK.length===5 && cleanK[0]===key[0] && cleanK[1]===key[1] && cleanK[2]===key[2] && cleanK[3]===key[3] && cleanK[4]===key[4]) return v;
            }
            return key+" (未定义类型)";
        }
        function checkConsistency(answers) {
            let passed=0, details=[];
            for(let [id1,id2] of CONSISTENCY_PAIRS) {
                let s1=answers[id1-1]||3, s2=answers[id2-1]||3;
                let diff=Math.abs(s1+s2-6), ok=diff<=2;
                if(ok) passed++;
                details.push({q1:id1,q2:id2,score1:s1,score2:s2,diff,ok});
            }
            return {total:details.length, passed, details};
        }
        function countMiddleAnswers(answers) { let c=0; for(let a of answers) if(a===3) c++; return c; }

        // ===================== 存储 =====================
        function saveRecord(data) {
            let records=JSON.parse(localStorage.getItem('bigfive_records')||'[]');
            let record={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), created_at:new Date().toISOString(), ...data};
            records.push(record);
            localStorage.setItem('bigfive_records', JSON.stringify(records));
            return record;
        }
        function getRecords(){ return JSON.parse(localStorage.getItem('bigfive_records')||'[]'); }
        function getRecord(id){ return getRecords().find(r=>r.id===id)||null; }

        // ===================== 页面逻辑 =====================
        const pageTest=document.getElementById('page-test');
        const pageSuccess=document.getElementById('page-success');
        const pageAdmin=document.getElementById('page-admin');
        const pageAdminDetail=document.getElementById('page-admin-detail');

        let state={
            started:false, currentQ:0, answers:new Array(50).fill(null),
            answerDurations:new Array(50).fill(0), startTimes:new Array(50).fill(0),
            name:'', idNumber:'', submitted:false, recordId:null
        };

        function renderTest() {
            pageTest.classList.remove('hidden');
            pageSuccess.classList.add('hidden');
            pageAdmin.classList.add('hidden');
            pageAdminDetail.classList.add('hidden');

            if(!state.started) {
                let html=`
                    <div class="header"><h1>🧠 大五人格测试</h1><div class="sub">描述性了解 · 不影响录取</div></div>
                    <div class="instruction">
                        <strong>📋 指导语</strong><br>
                        该测试仅作为一个描述性了解，不涉及个人录取与否。<br>
                        请根据您近两年的实际表现，而非理想状态，诚实作答。<br><br>
                        选项本身没有“好坏”之分，请根据自己的第一感觉回答，不要过多思考“应该”怎么选。<br>
                        <strong>提醒：</strong>请尽量避免中性选择"3=一般"，以保证结果有效。
                    </div>
                    <div class="form-group"><label>姓名</label><input type="text" id="input-name" placeholder="请输入您的姓名" value="${state.name}"></div>
                    <div class="form-group"><label>身份证号</label><input type="text" id="input-idnumber" placeholder="请输入身份证号" value="${state.idNumber}"></div>
                    <button class="btn btn-primary" onclick="startTest()">开始测试 →</button>
                    <div class="footer-note">共 ${QUESTIONS.length} 题，约需 5-8 分钟</div>
                `;
                pageTest.innerHTML=html;
                return;
            }

            let q=QUESTIONS[state.currentQ], total=QUESTIONS.length, progress=state.currentQ/total*100;
            let selected=state.answers[state.currentQ]||null;
            let allAnswered=state.answers.every(a=>a!==null);
            if(state.startTimes[state.currentQ]===0) state.startTimes[state.currentQ]=Date.now();

            let html=`
                <div class="header"><h1>🧠 大五人格测试</h1><div class="badge-progress">${state.currentQ+1} / ${total}</div></div>
                <div class="question-card">
                    <div class="q-number">第 ${state.currentQ+1} 题</div>
                    <div class="q-text">${q.text}</div>
                    <div class="options">
            `;
            let labels=['非常不符合','不太符合','一般','比较符合','非常符合'];
            for(let i=1;i<=5;i++){
                let sel=selected===i?'selected':'';
                html+=`<div class="option-item ${sel}" onclick="selectOption(${i})"><div class="radio-circle"></div><span class="option-label">${labels[i-1]}</span><span class="option-score">${i}</span></div>`;
            }
            html+=`
                    </div>
                </div>
                <div class="progress-wrap">
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
                    <div class="progress-text"><span>进度</span><span>${Math.round(progress)}%</span></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:8px;">
                    <button class="btn btn-secondary" onclick="prevQuestion()" ${state.currentQ===0?'disabled':''}>← 上一题</button>
                    <button class="btn btn-primary" onclick="nextQuestion()" ${!selected?'disabled':''}>${allAnswered?'📊 提交':'继续 →'}</button>
                </div>
                <div style="margin-top:12px; font-size:13px; color:#6b7a8d; text-align:center;">已答 ${state.answers.filter(a=>a!==null).length} / ${total} 题</div>
            `;
            pageTest.innerHTML=html;
        }

        window.startTest=function(){
            let name=document.getElementById('input-name').value.trim();
            let idNumber=document.getElementById('input-idnumber').value.trim();
            if(!name){alert('请输入姓名'); return;}
            if(!idNumber){alert('请输入身份证号'); return;}
            state.name=name; state.idNumber=idNumber; state.started=true;
            state.currentQ=0; state.answers=new Array(50).fill(null);
            state.answerDurations=new Array(50).fill(0); state.startTimes=new Array(50).fill(0);
            renderTest();
        };
        window.selectOption=function(val){
            let start=state.startTimes[state.currentQ];
            if(start>0) state.answerDurations[state.currentQ]=Date.now()-start;
            state.answers[state.currentQ]=val;
            renderTest();
            setTimeout(()=>{
                let allAnswered=state.answers.every(a=>a!==null);
                if(allAnswered) submitTest();
                else if(state.currentQ<QUESTIONS.length-1){ state.currentQ++; renderTest(); }
            },280);
        };
        window.prevQuestion=function(){ if(state.currentQ>0){ state.currentQ--; renderTest(); } };
        window.nextQuestion=function(){
            if(state.answers[state.currentQ]===null) return;
            let allAnswered=state.answers.every(a=>a!==null);
            if(allAnswered) submitTest();
            else if(state.currentQ<QUESTIONS.length-1){ state.currentQ++; renderTest(); }
        };

        function submitTest(){
            if(state.submitted) return;
            let allAnswered=state.answers.every(a=>a!==null);
            if(!allAnswered){alert('请完成所有题目'); return;}
            state.submitted=true;
            let {scores, levels, raw}=calcScores(state.answers);
            let typeKey=getTypeKey(levels), typeName=getTypeName(typeKey);
            let consistency=checkConsistency(state.answers);
            let middleCount=countMiddleAnswers(state.answers);
            let answersDetail=state.answers.map((score,idx)=>({questionId:idx+1, score, duration:state.answerDurations[idx]||0}));
            let record=saveRecord({
                name:state.name, idNumber:state.idNumber,
                answers:state.answers.slice(), answerDurations:state.answerDurations.slice(),
                answersDetail, scores, levels, raw, typeKey, typeName, consistency, middleCount
            });
            state.recordId=record.id;
            renderSuccess();
        }
        function renderSuccess(){
            pageTest.classList.add('hidden');
            pageSuccess.classList.remove('hidden');
            pageAdmin.classList.add('hidden');
            pageAdminDetail.classList.add('hidden');
            pageSuccess.innerHTML=`
                <div class="success-icon">✅</div>
                <div class="success-title">提交成功</div>
                <div class="success-desc">感谢您的参与，您的作答已成功提交。</div>
                <div class="footer-note">结果将由管理员统一查看</div>
            `;
        }
        window.resetTest=function(){
            state={started:false, currentQ:0, answers:new Array(50).fill(null), answerDurations:new Array(50).fill(0), startTimes:new Array(50).fill(0), name:'', idNumber:'', submitted:false, recordId:null};
            renderTest();
        };

        // ===================== 管理后台 =====================
        window.showAdmin=function(){
            pageTest.classList.add('hidden');
            pageSuccess.classList.add('hidden');
            pageAdmin.classList.remove('hidden');
            pageAdminDetail.classList.add('hidden');
            renderAdmin();
        };
        function renderAdmin(){
            let records=getRecords();
            let html=`
                <div class="header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                    <div><h1>📋 管理后台</h1><div class="sub">共 ${records.length} 条测试记录</div></div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn btn-secondary" onclick="exportData()" style="width:auto; padding:8px 20px; font-size:14px;">📥 导出数据</button>
                        <button class="btn btn-secondary" onclick="resetTest()" style="width:auto; padding:8px 20px; font-size:14px;">🧪 回到测试</button>
                    </div>
                </div>
                <div class="admin-stat"><span>📊 总记录: ${records.length}</span><span>⏱ 最近: ${records.length?new Date(records[records.length-1].created_at).toLocaleString():'-'}</span></div>
            `;
            if(records.length===0){ html+=`<div style="text-align:center; padding:40px 0; color:#6b7a8d;">暂无测试记录</div>`; pageAdmin.innerHTML=html; return; }
            html+=`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>姓名</th><th>身份证号</th><th>时间</th><th>E</th><th>A</th><th>C</th><th>N</th><th>O</th><th>类型</th><th>一致性</th><th>操作</th></tr></thead><tbody>`;
            let sorted=[...records].reverse();
            for(let r of sorted){
                let s=r.scores||{}, cons=r.consistency||{passed:0,total:0};
                let consRate=cons.total?Math.round(cons.passed/cons.total*100):0;
                let warn=consRate<70?'🔴':(r.middleCount>10?'🟡':'🟢');
                let time=new Date(r.created_at).toLocaleString();
                let idDisplay=r.idNumber||'';
                if(idDisplay.length>10) idDisplay=idDisplay.slice(0,6)+'****'+idDisplay.slice(-4);
                html+=`<tr><td><strong>${r.name}</strong></td><td style="font-size:13px;color:#4a5a6a;">${idDisplay}</td><td style="font-size:12px;color:#6b7a8d;">${time}</td>
                    <td>${s.E||'-'}</td><td>${s.A||'-'}</td><td>${s.C||'-'}</td><td>${s.N||'-'}</td><td>${s.O||'-'}</td>
                    <td style="font-weight:600;font-size:13px;">${r.typeKey||'-'}</td><td>${warn} ${consRate}%</td>
                    <td><button class="btn btn-secondary" onclick="viewDetail('${r.id}')" style="width:auto;padding:4px 14px;font-size:13px;">查看</button></td></tr>`;
            }
            html+=`</tbody></table></div>`;
            pageAdmin.innerHTML=html;
        }
        window.viewDetail=function(id){
            let record=getRecord(id);
            if(!record){alert('记录不存在'); return;}
            pageAdmin.classList.add('hidden');
            pageAdminDetail.classList.remove('hidden');
            renderDetail(record);
        };
        function renderDetail(record){
            let {scores, levels, typeKey, typeName, consistency, answers, answerDurations, answersDetail, name, idNumber, created_at, middleCount}=record;
            let dimOrder=['E','A','C','N','O'];
            let dimLabels={E:'外向性',A:'宜人性',C:'尽责性',N:'情绪稳定性',O:'开放性'};
            let html=`
                <div class="header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                    <div><h1>📄 详细结果</h1><div class="sub">${name} · 身份证: ${idNumber||'未提供'} · ${new Date(created_at).toLocaleString()}</div></div>
                    <button class="btn btn-secondary" onclick="showAdmin()" style="width:auto;padding:8px 20px;font-size:14px;">← 返回列表</button>
                </div>
                <div style="text-align:center;margin:8px 0;"><span class="type-badge" style="font-size:20px;">${typeKey}</span><div class="type-desc">${typeName}</div></div>
                <div class="result-grid">
            `;
            for(let d of dimOrder){
                let s=scores[d], lv=levels[d];
                let lvClass=lv==='高'?'level-high':lv==='中'?'level-mid':'level-low';
                html+=`<div class="result-item"><div class="dim">${dimLabels[d]}</div><div class="score">${s}</div><div class="level ${lvClass}">${lv}</div></div>`;
            }
            html+=`</div>`;
            let cons=consistency||{passed:0,total:0};
            let passRate=cons.total?cons.passed/cons.total:0;
            if(passRate<0.7) html+=`<div class="consistency-warn"><strong>⚠️ 一致性偏低 (${cons.passed}/${cons.total})</strong><br>${middleCount>10?`🔸 中性回答 (3分) 共 ${middleCount} 次，可能影响结果区分度。`:''}</div>`;
            else if(middleCount>10) html+=`<div class="consistency-warn"><strong>⚠️ 中性回答较多</strong><br>您选择了 ${middleCount} 次"一般"，可能导致结果趋于居中。</div>`;
            else html+=`<div class="consistency-ok">✅ 一致性良好 (${cons.passed}/${cons.total}) · 中性回答 ${middleCount} 次</div>`;

            html+=`
                <div style="margin-top:16px;">
                    <button class="btn btn-secondary" onclick="toggleDetailAnswers()" style="width:auto;padding:8px 20px;font-size:14px;">📋 查看全部答题（含耗时）</button>
                    <div id="detail-answers-wrap" style="display:none;margin-top:12px;max-height:500px;overflow-y:auto;background:#f8fafd;border-radius:16px;padding:16px;">
                        <table style="width:100%;font-size:13px;border-collapse:collapse;">
                            <tr><th style="text-align:left;padding:4px 6px;">题号</th><th style="text-align:left;padding:4px 6px;">题目</th><th style="text-align:center;padding:4px 6px;">得分</th><th style="text-align:center;padding:4px 6px;">耗时 (秒)</th><th style="text-align:center;padding:4px 6px;">维度</th></tr>
            `;
            let details=answersDetail||QUESTIONS.map((q,i)=>({questionId:q.id, score:answers?answers[i]:'-', duration:answerDurations?answerDurations[i]:0}));
            for(let i=0;i<QUESTIONS.length;i++){
                let q=QUESTIONS[i], detail=details[i]||{};
                let val=detail.score!==undefined?detail.score:(answers?answers[i]:'-');
                let dur=detail.duration||0;
                let seconds=(dur/1000).toFixed(1);
                let bg=val===3?'background:#fff4e0;':'';
                html+=`<tr style="${bg}"><td style="padding:3px 6px;">${q.id}</td><td style="padding:3px 6px;">${q.text}</td><td style="text-align:center;padding:3px 6px;font-weight:600;">${val}</td><td style="text-align:center;padding:3px 6px;">${seconds}s</td><td style="text-align:center;padding:3px 6px;font-size:12px;color:#6b7a8d;">${q.dim}</td></tr>`;
            }
            html+=`</table></div></div>`;
            pageAdminDetail.innerHTML=html;
        }
        window.toggleDetailAnswers=function(){
            let wrap=document.getElementById('detail-answers-wrap');
            if(wrap) wrap.style.display=wrap.style.display==='none'?'block':'none';
        };
        window.exportData=function(){
            let records=getRecords();
            if(!records.length){alert('暂无数据可导出'); return;}
            let headers=['ID','姓名','身份证号','时间','E','A','C','N','O','类型','一致性通过率','中性回答数','平均每题耗时(s)'];
            let rows=[headers];
            for(let r of records){
                let s=r.scores||{}, cons=r.consistency||{passed:0,total:0};
                let rate=cons.total?Math.round(cons.passed/cons.total*100):0;
                let durations=r.answerDurations||[];
                let avgDur=durations.length?(durations.reduce((a,b)=>a+b,0)/durations.length/1000).toFixed(1):'-';
                rows.push([r.id, r.name, r.idNumber||'', new Date(r.created_at).toLocaleString(),
                    s.E||'', s.A||'', s.C||'', s.N||'', s.O||'',
                    r.typeKey||'', rate+'%', r.middleCount||0, avgDur]);
            }
            let csv=rows.map(row=>row.join(',')).join('\n');
            let blob=new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
            let link=document.createElement('a');
            link.href=URL.createObjectURL(blob);
            link.download=`大五人格测试数据_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        };

        // ===================== 初始化 =====================
        if(window.location.search.includes('admin')) showAdmin();
        else renderTest();

        document.addEventListener('keydown', function(e){
            if(e.key==='ArrowLeft') { if(!pageTest.classList.contains('hidden')) window.prevQuestion&&window.prevQuestion(); }
            else if(e.key==='ArrowRight') { if(!pageTest.classList.contains('hidden')) window.nextQuestion&&window.nextQuestion(); }
        });
        console.log('🧠 大五人格测试已加载 (含每题计时)');
        console.log('📊 后台入口: 在URL后添加 ?admin');
        console.log('📋 数据存储在 localStorage 中');
    </script>
</body>
</html>
