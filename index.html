        .options { display:flex; flex-direction:column; gap:10px; }
        .option-item { display:flex; align-items:center; padding:14px 18px; border:2px solid #e8edf5; border-radius:14px; cursor:pointer; transition:0.12s; background:#fafcff; user-select:none; }
        .option-item:hover { border-color:#b8c9e0; background:#f5f8fe; }
        .option-item.selected { border-color:#1a2a3a; background:#f0f4fe; }

                let cleanK=k.replace(/\s/g,'');
                if(cleanK.length===5 && cleanK[0]===key[0] && cleanK[1]===key[1] && cleanK[2]===key[2] && cleanK[3]===key[3] && cleanK[4]===key[4]) return v;
            }
            return key+" (未定义类型)";
        }
        function checkConsistency(answers) {
            let passed=0, details=[];
            for(let [id1,id2] of CONSISTENCY_PAIRS) {
                let s1=answers[id1-1]||3, s2=answers[id2-1]||3;
                let diff=Math.abs(s1+s2-6), ok=diff<=2;
                if(ok) passed++;
                details.push({q1:id1,q2:id2,score1:s1,score2:s2,diff,ok});
            }
            return {total:details.length, passed, details};
        }
        function countMiddleAnswers(answers) { let c=0; for(let a of answers) if(a===3) c++; return c; }
        function detectQualityIssues(answers) {
            let issues = [];
            let scores = answers.filter(a => a !== null && a !== undefined);
            if (scores.length === 0) return issues;
            let mean = scores.reduce((a,b)=>a+b,0) / scores.length;
            let variance = scores.reduce((a,b)=>a + Math.pow(b-mean,2), 0) / scores.length;
            let stdDev = Math.sqrt(variance);
            if (stdDev < 0.8) issues.push({ type: '直线作答', detail: `选项离散度极低（标准差=${stdDev.toFixed(2)}），可能未认真阅读。` });
            let maxSeq = 1, curSeq = 1;
            for (let i=1; i<scores.length; i++) {
                if (scores[i] === scores[i-1] + 1 || scores[i] === scores[i-1] - 1) { curSeq++; if(curSeq>maxSeq) maxSeq=curSeq; }
                else curSeq = 1;
            }
            if (maxSeq >= 8) issues.push({ type: '规律性作答', detail: `连续递增/递减序列长度达 ${maxSeq} 题，存在机械点选嫌疑。` });
            let extremeCount = scores.filter(v => v === 1 || v === 5).length;
            if (extremeCount > 30) issues.push({ type: '极端社会赞许性', detail: `选"非常不符合(1)"或"非常符合(5)"共 ${extremeCount} 题（>30），可能存在刻意美化或贬低。` });
            return issues;
        }
        function getJobRecommendations(typeKey) {
            const dims = typeKey.split('').map(ch => ch === 'H');
            const dimNames = ['e','a','c','n','o'];
            let scored = JOB_DB.map(job => {
                let score = 0;
                for (let i=0; i<5; i++) {
                    const isHigh = dims[i];
                    const jobVal = job[dimNames[i]] || 3;
                    if (isHigh) score += jobVal * 2;
                    else score += (6 - jobVal) * 2;
                }
                return { name: job.name, category: job.category, score: score };
            });
            scored.sort((a,b) => b.score - a.score);
            const recommended = scored.slice(0,3);
            const notRecommended = scored.slice(-2).reverse();
            return { recommended, notRecommended };
        }

                        birth: data.birth,
                        answers: data.answers,
                        answer_durations: data.answerDurations,
                        answers_detail: data.answersDetail,
                        scores: data.scores,
                        levels: data.levels,

                        type_name: data.typeName,
                        consistency: data.consistency,

                    }])
                    .select();
                if (error) { console.error('Supabase 插入错误:', error); alert('数据保存失败，请重试'); return null; }

        // ===================== 提交与成功 =====================
        async function submitTest() {
            if (state.submitted) return;
            if (!state.answers.every(a=>a!==null)) { alert('请完成所有题目'); return; }
            state.submitted = true;

            let {scores, levels, raw} = calcScores(state.answers);
            let typeKey = getTypeKey(levels);
            let typeName = getTypeName(typeKey);
            let consistency = checkConsistency(state.answers);
            let middleCount = countMiddleAnswers(state.answers);
            let answersDetail = state.answers.map((score,idx)=>({questionId:idx+1, score, duration:state.answerDurations[idx]||0}));
            let qualityIssues = detectQualityIssues(state.answers);

            let recordData = {

                raw,
                typeKey,
                typeName,
                consistency,
                middleCount,

            };

            `;

            let html=`
                <div class="header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                    <div><h1>📄 详细结果</h1><div class="sub">${name} · 出生: ${birthDisplay} · ${new Date(created_at).toLocaleString()}</div></div>
                    <button class="btn btn-secondary" onclick="showAdminDashboard()" style="width:auto;padding:8px 20px;font-size:14px;">← 返回列表</button>
                </div>
                <div style="text-align:center;margin:8px 0;">
                    <span class="type-badge" style="font-size:20px;">${typeKey}</span>
                    <div class="type-desc">${typeName}</div>
                </div>
                ${jobHtml}
                <div class="result-grid">
            `;
            for (let d of dimOrder) {
                let s=scores[d], lv=levels[d];
                let lvClass=lv==='高'?'level-high':lv==='中'?'level-mid':'level-low';
                html+=`<div class="result-item"><div class="dim">${dimLabels[d]}</div><div class="score">${s}</div><div class="level ${lvClass}">${lv}</div></div>`;
            }
            html+=`</div>`;

            if (passRate<70) {
                html+=`<div class="consistency-warn"><strong>⚠️ 一致性偏低 (通过率：${passRate}%，${cons.passed}/${cons.total})</strong><br>`;
                if (middleCount>10) html+=`🔸 中性回答 (3分) 共 ${middleCount} 次，可能影响结果区分度。<br>`;
                let conflictItems=[];
                for (let item of (cons.details||[])) { if (!item.ok) conflictItems.push(`第${item.q1}题与第${item.q2}题`); }
                if (conflictItems.length>0) html+=`🔸 存在矛盾配对：${conflictItems.join('、')}`;
                html+=`</div>`;
            } else if (middleCount>10) {
                html+=`<div class="consistency-warn"><strong>⚠️ 中性回答较多 (通过率：${passRate}%)</strong><br>您选择了 ${middleCount} 次"一般"，可能导致结果趋于居中。</div>`;
            } else {
                html+=`<div class="consistency-ok">✅ 一致性良好 (通过率：${passRate}%，${cons.passed}/${cons.total}) · 中性回答 ${middleCount} 次</div>`;
            }

            if (fastQuestions.length>0) {
                let qList=fastQuestions.join('、');
                html+=`<div class="warning-box"><strong>⚠️ 秒选警告</strong><br>🚨 以下题目答题耗时过短（<3秒），可能存在秒选：<strong>第${qList}题</strong><br>📊 平均每题耗时：<strong>${avgDur} 秒</strong>（正常参考值：5-10秒/题）</div>`;
            }

            let issues = qualityIssues || [];
            if (issues.length>0) {
                html+=`<div class="quality-summary"><h3>📌 作答质量异常检测</h3><ul>`;
                for (let issue of issues) {
                    html+=`<li><span class="quality-fail">❌ ${issue.type}</span>：${issue.detail}</li>`;
                }
                html+=`</ul></div>`;
            } else {
                html+=`<div class="quality-summary" style="border-color:#c3e6cb; background:#d4edda;"><h3 style="color:#155724;">✅ 作答质量良好</h3><p style="margin:0;font-size:14px;">未检测到直线作答、规律性点选或极端社会赞许性等异常。</p></div>`;
            }

            html+=`
                <div style="margin-top:16px;">
                    <button class="btn btn-secondary" onclick="toggleDetailAnswers()" style="width:auto;padding:8px 20px;font-size:14px;">📋 查看全部答题（含耗时）</button>
                    <div id="detail-answers-wrap" style="display:none;margin-top:12px;max-height:500px;overflow-y:auto;background:#f8fafd;border-radius:16px;padding:16px;">
                        <table style="width:100%;font-size:13px;border-collapse:collapse;">
                            <tr><th style="text-align:left;padding:4px 6px;">题号</th><th style="text-align:left;padding:4px 6px;">题目</th><th style="text-align:center;padding:4px 6px;">得分</th><th style="text-align:center;padding:4px 6px;">耗时 (秒)</th><th style="text-align:center;padding:4px 6px;">维度</th></tr>
            `;
            for (let i=0; i<QUESTIONS.length; i++) {
                let q=QUESTIONS[i], detail=details[i]||{};
                let val=detail.score!==undefined?detail.score:(answers?answers[i]:'-');
                let dur=detail.duration||0;
                let seconds=(dur/1000).toFixed(1);
                let bg=val===3?'background:#fff4e0;':'';
                if (dur>0 && dur<3000) bg='background:#ffe0e0 !important;';
                html+=`<tr style="${bg}">
                    <td style="padding:3px 6px;">${q.id}</td>
                    <td style="padding:3px 6px;">${q.text}</td>
                    <td style="text-align:center;padding:3px 6px;font-weight:600;">${val}</td>
                    <td style="text-align:center;padding:3px 6px;">${seconds}s</td>
                    <td style="text-align:center;padding:3px 6px;font-size:12px;color:#6b7a8d;">${q.dim}</td>
                </tr>`;
            }
            html+=`</table></div></div>`;
            pageAdminDetail.innerHTML=html;
        }

        window.toggleDetailAnswers = function() {
            let wrap=document.getElementById('detail-answers-wrap');
            if (wrap) wrap.style.display = wrap.style.display==='none'?'block':'none';
        };

        async function exportData() {
            let records = await getRecords();
            if (!records.length) { alert('暂无数据可导出'); return; }
            let headers=['ID','姓名','出生年月','时间','E','A','C','N','O','类型','一致性通过率','中性回答数','平均每题耗时(s)','质量异常'];
            let rows=[headers];
            for (let r of records) {
                let s=r.scores||{}, cons=r.consistency||{passed:0,total:0};
                let rate=cons.total?Math.round(cons.passed/cons.total*100):0;
                let durations=r.answer_durations||[];
                let avgDur=durations.length?(durations.reduce((a,b)=>a+b,0)/durations.length/1000).toFixed(1):'-';
                let issues=(r.quality_issues||[]).map(i=>i.type).join('; ')||'无';
                rows.push([r.id, r.name, r.birth||'', new Date(r.created_at).toLocaleString(),
                    s.E||'', s.A||'', s.C||'', s.N||'', s.O||'',
                    r.type_key||'', rate+'%', r.middle_count||0, avgDur, issues]);
            }
            let csv=rows.map(row=>row.join(',')).join('\n');
            let blob=new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
            let link=document.createElement('a');
            link.href=URL.createObjectURL(blob);
            link.download=`个人特质测试数据_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ===================== 初始化 =====================
        // 等待 Supabase 库加载完成
        let supabaseLoaded = false;
        function waitForSupabase(callback) {
            if (typeof supabase !== 'undefined') {
                supabaseLoaded = initSupabase();
                if (supabaseLoaded) callback();
                else setTimeout(() => waitForSupabase(callback), 300);
            } else {
                setTimeout(() => waitForSupabase(callback), 300);
            }
        }

        // 加载 Supabase JS 库
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        document.head.appendChild(script);
        script.onload = function() {
            initSupabase();
            // 判断后台模式
            if (window.location.search.includes('admin')) {
                showAdminLogin();
            } else {
                renderTest();
            }
        };
        // 如果库加载失败，10秒后尝试直接初始化
        setTimeout(() => {
            if (!supabaseClient && typeof supabase !== 'undefined') {
                initSupabase();
                if (window.location.search.includes('admin')) {
                    showAdminLogin();
                } else {
                    renderTest();
                }
            }
        }, 10000);

        console.log('🧠 个人特质测试已加载 (Supabase 云存储版)');
        console.log('📊 后台入口: 在URL后添加 ?admin');
    </script>
</body>
</html>
